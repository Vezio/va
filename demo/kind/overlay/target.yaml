# The system under test: go-httpbin, a small HTTP service that answers predictably.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target
spec:
  replicas: 1
  selector:
    matchLabels: {app: target}
  template:
    metadata:
      labels: {app: target}
    spec:
      containers:
        - name: httpbin
          image: docker.io/mccutchen/go-httpbin:v2.15.0
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /status/200, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: target
spec:
  selector: {app: target}
  ports: [{port: 80, targetPort: 8080}]
