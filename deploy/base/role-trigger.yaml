# For whatever runs trigger.sh (a person, a CI job, a rollout hook). Unbound here: the overlay
# binds it to the caller's identity. Read the CronJob, create Jobs; nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-trigger
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get]
