# Role for callers of trigger.sh (a person, a CI job or a rollout hook). The overlay binds it to
# the caller's identity. It grants read access to the CronJob and permission to create Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-trigger
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get]
