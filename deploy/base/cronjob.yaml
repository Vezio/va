# Pod specification for scheduled runs; trigger.sh copies it for on-demand runs. An overlay
# supplies the namespace, image, profile, settings and schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  # Applies to scheduled runs only. A triggered Job may overlap, since run IDs are unique.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Failed runs are not retried, so that each failure is reported as it occurred.
      backoffLimit: 0
      # Must exceed <APP>_RUN_BUDGET (app-settings) plus the time to compare, publish and notify.
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          # The run does not call the Kubernetes API. Mount a token only if a tool reads the cluster.
          automountServiceAccountToken: false
          restartPolicy: Never
          # Allows `job` to publish and notify after SIGTERM.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: app
              image: app
              # Arguments not defined by `job` are passed to `<app> run` (selection, labels). The
              # budget, profile and destination are read from app-settings.
              args: ["job", "--compare", "--label", "trigger=nightly"]
              envFrom:
                # Results destination (<APP>_RESULTS_URI), group, S3 endpoint and region.
                - configMapRef:
                    name: app-settings
                # Notifier URLs (referenced by notifier specs as env:NAME), object-store keys and
                # target credentials. Created separately from these manifests.
                - secretRef:
                    name: app-secrets
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: profile
                  mountPath: /etc/app
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: profile
              configMap:
                name: app-profile
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
