[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "httpcheck"
dynamic = ["version"]
description = "Example VA tool: check deployed HTTP services against a profile"
requires-python = ">=3.11"
# A tool outside this repository pins a commit instead; scripts/new-app.sh writes it.
dependencies = ["va-framework>=0.4"]

[project.scripts]
httpcheck = "httpcheck.cli:main"

[tool.setuptools.dynamic]
version = {attr = "httpcheck.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
