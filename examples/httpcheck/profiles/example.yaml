# A committed profile names environment variables instead of containing URLs or keys. The
# real values are set in the environment, or in a <name>.local.yaml copy that .gitignore
# excludes.
#
# Declare how a correct service behaves. When a target differs, the case fails and the result
# is triaged. The profile is not changed to make the run pass.
name: example-service

targets:
  - name: gateway
    base_url_env: GATEWAY_URL
    key_env: GATEWAY_TOKEN
    capabilities: [health, json, auth]
    health_path: /health
    max_latency_ms: 500

  - name: backend
    base_url_env: BACKEND_URL
    capabilities: [health, json]
    health_path: /health
