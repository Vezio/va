[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-framework"
dynamic = ["version"]
description = "A framework for building command-line tools that verify deployed systems, record evidence for every result and attribute each failure to the component responsible. Developed for model-serving infrastructure and applicable to any deployed service."
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = [
    "testing",
    "verification",
    "functional-testing",
    "smoke-testing",
    "conformance",
    "regression",
    "deployment",
    "kubernetes",
    "ci",
    "observability",
    "model-serving",
    "inference",
    "llm",
]
authors = [{ name = "Tyler Vezio Rimaldi" }, { name = "Alberto Perdomo" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# PyYAML is the only required dependency; profiles are YAML by default. Other integrations are
# optional extras.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# Publication to S3 or S3-compatible storage.
s3 = ["boto3>=1.34"]
# Retained so that existing requirements on va-framework[yaml] continue to resolve.
yaml = []
# Pin ruff exactly, and keep .pre-commit-config.yaml in sync with it.
dev = ["ruff==0.8.6", "pytest>=8", "types-PyYAML", "mypy>=1.10", "moto[s3]>=5", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/Vezio/va"
Documentation = "https://github.com/Vezio/va/tree/main/docs"
Issues = "https://github.com/Vezio/va/issues"

[tool.setuptools.dynamic]
version = {attr = "va.__version__"}

[tool.setuptools.package-data]
va = ["py.typed", "outputs/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*/build"]

[tool.ruff.lint]
# T20 bans print(); output goes through the logger tree (va.log).
# D enforces Google-style docstrings. Constructor arguments are documented in the class
# docstring, so D107 is disabled.
select = ["E", "F", "W", "I", "T20", "B", "UP", "D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples/httpcheck/tests", "examples/modelcheck/tests"]
