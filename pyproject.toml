[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runkit"
dynamic = ["version"]
description = "A skeleton for CLIs that test deployed systems: exit codes that separate blame, evidence for every verdict, redacted logs, run directories published to file:// or s3://, Kubernetes CronJobs and CI."
authors = [{ name = "Tyler Vezio Rimaldi" }, { name = "Alberto Perdomo" }]
requires-python = ">=3.11"
# Standard library only. Everything else is an extra, so a minimal install has nothing to pin.
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]           # publishing to S3 or an S3-compatible store
yaml = ["PyYAML>=6"]           # YAML profiles (TOML and JSON need nothing)
# Pin ruff exactly, and keep .pre-commit-config.yaml in sync with it.
dev = ["ruff==0.8.6", "pytest>=8", "PyYAML>=6", "mypy>=1.10", "moto[s3]>=5", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "runkit.__version__"}

[tool.setuptools.package-data]
runkit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*/build"]

[tool.ruff.lint]
# T20 bans print(): all output goes through the logger tree (runkit.log).
select = ["E", "F", "W", "I", "T20", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
