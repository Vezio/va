[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-framework"
dynamic = ["version"]
description = "A skeleton for CLIs that test deployed systems: exit codes that separate blame, evidence for every verdict, redacted logs, run directories published to file:// or s3://, Kubernetes CronJobs and CI."
authors = [{ name = "Tyler Vezio Rimaldi" }, { name = "Alberto Perdomo" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Standard library only. Everything else is an extra, so a minimal install has nothing to pin.
dependencies = ["PyYAML>=6"]   # profiles are YAML by default

[project.optional-dependencies]
s3 = ["boto3>=1.34"]           # publishing to S3 or an S3-compatible store
yaml = []                      # kept so existing pins of va-framework[yaml] still resolve
# Pin ruff exactly, and keep .pre-commit-config.yaml in sync with it.
dev = ["ruff==0.8.6", "pytest>=8", "types-PyYAML", "mypy>=1.10", "moto[s3]>=5", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "va.__version__"}

[tool.setuptools.package-data]
va = ["py.typed", "outputs/*.css"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*/build"]

[tool.ruff.lint]
# T20 bans print(); output goes through the logger tree (va.log).
# D enforces Google-style docstrings. Constructor arguments are documented in the class
# docstring, so D107 is disabled.
select = ["E", "F", "W", "I", "T20", "B", "UP", "D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples/httpcheck/tests", "examples/modelcheck/tests"]
