# End-to-end test of the Kubernetes deployment on a temporary kind cluster. Deploys deploy/base
# with the demo overlay, publishes a triggered run to an in-cluster S3 store, and verifies the
# CronJob behaviour (scheduling, no retries, exit codes, publication) with demo/kind/test.sh.
name: Kind demo
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/**"
      - "demo/kind/**"
      - "container/**"
      - "src/**"
      - "examples/**"
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install kind (if the runner image lacks it)
        run: |
          command -v kind && exit 0
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          sudo install -m 0755 kind /usr/local/bin/kind
      - run: demo/kind/up.sh
      - run: demo/kind/test.sh
      - if: always()
        run: demo/kind/down.sh
