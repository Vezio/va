# Checks that do not require a deployed target: library and example tests (S3 against a mock),
# type checking, linting, Kubernetes manifests, shell scripts and the container image build.
name: Offline tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/install.sh --dev
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/mypy src/va examples/httpcheck/src examples/modelcheck/src
      - run: .venv/bin/python -m pytest -q  # Runs the testpaths in pyproject.toml.
      - run: demo/local/run.sh

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Manifests render
        run: |
          kubectl kustomize deploy/base > /dev/null
          kubectl kustomize deploy/overlays/example > /dev/null
      - name: Scripts pass shellcheck
        run: shellcheck deploy/trigger.sh scripts/*.sh
      - name: The runner image builds from the lock
        run: |
          docker build -f container/Containerfile --build-arg GIT_SHA="$GITHUB_SHA" -t runner:ci .
          docker run --rm runner:ci --version
          test "$(docker run --rm --entrypoint id runner:ci -u)" != 0
